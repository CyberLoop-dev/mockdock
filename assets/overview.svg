<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d"><title id="t">MockDock request flow</title><desc id="d">A request flows through a route matcher to a JSON response.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#0ea5e9"/><stop offset="1" stop-color="#22c55e"/></linearGradient></defs><rect width="900" height="300" rx="28" fill="#0f172a"/><g font-family="ui-monospace,monospace" text-anchor="middle" fill="#e2e8f0"><rect x="70" y="95" width="190" height="110" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text x="165" y="140" font-size="22">REQUEST</text><text x="165" y="172" font-size="15" fill="#94a3b8">GET /api/users/42</text><path d="M270 150 H355" stroke="url(#g)" stroke-width="5"/><path d="M345 139 L357 150 L345 161" fill="none" stroke="#22c55e" stroke-width="5"/><rect x="365" y="95" width="170" height="110" rx="18" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/><text x="450" y="145" font-size="21">ROUTE</text><text x="450" y="174" font-size="15" fill="#94a3b8">match + delay</text><path d="M545 150 H630" stroke="url(#g)" stroke-width="5"/><path d="M620 139 L632 150 L620 161" fill="none" stroke="#22c55e" stroke-width="5"/><rect x="640" y="95" width="190" height="110" rx="18" fill="#1e293b" stroke="#22c55e" stroke-width="2"/><text x="735" y="140" font-size="22">RESPONSE</text><text x="735" y="172" font-size="15" fill="#94a3b8">JSON + status</text><text x="450" y="255" font-size="14" fill="#64748b">LOCAL • CONFIGURABLE • PREDICTABLE</text></g></svg>